<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128">
  <title>AdamOne Edu — A1E emblem</title>
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#021027"/>
      <stop offset="1" stop-color="#123A6B"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C569B"/>
      <stop offset=".55" stop-color="#49AEF7"/>
      <stop offset="1" stop-color="#00BFA6"/>
    </linearGradient>
    <path id="arc-top" d="M16 64 A48 48 0 0 1 112 64"/>
    <path id="arc-bottom" d="M112 64 A48 48 0 0 1 16 64"/>
  </defs>

  <!-- seal base + gradient rim -->
  <circle cx="64" cy="64" r="63" fill="url(#disc)"/>
  <circle cx="64" cy="64" r="60.5" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="#F0F7F9" stroke-opacity=".22" stroke-width="1"/>
  <circle cx="64" cy="64" r="40.5" fill="none" stroke="#F0F7F9" stroke-opacity=".22" stroke-width="1"/>

  <!-- ring lettering -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="3.2" fill="#F0F7F9" fill-opacity=".95">
    <textPath href="#arc-top" xlink:href="#arc-top" startOffset="50%" text-anchor="middle">ADAMONE EDU</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="8.5" letter-spacing="4" fill="#49AEF7">
    <textPath href="#arc-bottom" xlink:href="#arc-bottom" startOffset="50%" text-anchor="middle">MMXXVI</textPath>
  </text>

  <!-- side markers -->
  <path d="M16 60.6 L19.4 64 L16 67.4 L12.6 64 Z" fill="#00BFA6"/>
  <path d="M112 60.6 L115.4 64 L112 67.4 L108.6 64 Z" fill="#00BFA6"/>

  <!-- A1E monogram (drawn, font-independent) -->
  <g stroke="#F0F7F9" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M38 80 L48 46 L58 80"/>
    <path d="M42.6 67 H53.4"/>
    <path d="M88 46 H73 V80 H88"/>
    <path d="M73 63 H84.5"/>
  </g>
  <path d="M61 52 L66.5 46 V80" stroke="#00BFA6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M45 88 H83" stroke="#49AEF7" stroke-width="2" stroke-linecap="round" opacity=".85"/>
</svg>
